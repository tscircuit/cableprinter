name: Review localized adapter gallery
on:
  push:
    branches: [codex/review-localized-adapter-gallery-20261007]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install
      - run: bun test tests/bullet-adapter-snapshots.test.ts --timeout 30000
        env:
          BUN_UPDATE_SNAPSHOTS: "1"
      - uses: actions/upload-artifact@v4
        with:
          name: localized-adapter-gallery
          path: tests/__snapshots__/bullet-adapter-cables.snap.png
          if-no-files-found: error
